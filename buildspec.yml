version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
  pre_build:
    commands:
      - echo "Iniciando compilacion Tutorial 2 DevOps..."
      - pip install -r requirements.txt
  build:
    commands:
      - echo "Ejecutando pruebas unitarias..."
      - python -m pytest -v
artifacts:
  files:
    - '**/*'
